name: Routine draft evals

# INTEL-03: the eval set against the real model. Recorded answers run on every
# pull request through `npm test`; this spends money, so it runs by hand and
# once a week, and does nothing without the secret.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * 1'

jobs:
  live:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate the Prisma client
        run: npx prisma generate

      - name: Run the evals
        run: npm run evals:routine-drafts
